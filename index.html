<div class="sk-lbl">Adress eller plats</div><div class="sk-inp"><small>Sök</small><input id="sk-q" autocomplete="off" placeholder="Gatuadress, station eller plats" value="${esc(RS.q)}"></div><div id="sk-sug">${skSugH()}</div>
${RS.sel?`<div class="sk-selp">📍 ${esc(RS.sel.address)}</div>`:''}

<div class="sk-inp"><small>Sök</small><input id="sk-q" autocomplete="off" placeholder="Adress eller plats" value="${esc(RS.q)}"></div><div id="sk-sug">${skSugH()}</div>${RS.sel?`<div class="sk-selp">📍 ${esc(RS.sel.address)}</div>`:''}
<div class="sk-go y" data-me="sk_savevenue">${RS.busy?'Sparar…':'Spara matchplats'}</div><div class="sk-skip" data-me="sk_close">Senare</div>`}
return''}
const skSugH=()=>RS&&RS.sugs&&RS.sugs.length?`<div class="sk-sug">${RS.sugs.map((s,i)=>`<div data-me="sk_sug" data-mv="${i}">📍 ${esc(s.address)}</div>`).join('')}</div>`:(RS&&RS.q&&RS.q.length>=3&&RS.searched?'<div class="mut" style="font-size:.8rem;margin:2px 2px 8px">Inga träffar – prova med stad, t.ex. "Storgatan 1, Bromma".</div>':'');
let _skT=null;
async function skGeo(q){const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=se&accept-language=sv&viewbox=17.4,59.1,18.6,59.7&q='+encodeURIComponent(q);const r=await fetch(u,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('Adressökningen svarade inte');return(await r.json()).map(x=>({address:String(x.display_name||'').split(',').slice(0,3).join(',').trim(),lat:+x.lat,lng:+x.lon}))}
document.addEventListener('input',e=>{if(!RS||!e.target||e.target.id!='sk-q')return;RS.q=e.target.value;RS.sel=null;clearTimeout(_skT);if(RS.q.trim().length<3){RS.sugs=[];RS.searched=false;const s=document.getElementById('sk-sug');if(s)s.innerHTML='';return}
_skT=setTimeout(async()=>{const q=RS&&RS.q.trim();if(!q)return;try{const r=await skGeo(q);if(!RS||RS.q.trim()!=q)return;RS.sugs=r;RS.searched=true;const s=document.getElementById('sk-sug');if(s)s.innerHTML=skSugH()}catch(er){if(RS){RS.err=er.message;skRender()}}},550)});

async function skAct(a,v,m,el){
const r=el&&el.dataset?el.dataset.mr:null;
try{
if(a=='sk_close'){skClose();return}
if(a=='sk_open'){skOpen(+m,v,r?+r:null);if(v=='need'||v=='pick'||v=='car'||v=='choose'){}return}
if(a=='sk_back'){const mm=RS&&RS.m;if(RS&&RS.ret=='close'){skClose();return}if(RS&&RS.ret){const mode=RS.ret;RS.ret=null;RS.mode=mode;RS.err='';skRender();return}if(mm)skOpen(mm,'choose');else skClose();return}
if(a=='sk_choose'){const mm=RS?RS.m:+m;if(v=='car'){skOpen(mm,'car');return}if(v=='need'){skOpen(mm,'need');return}
const ride=skMyRide(mm);if(ride&&skBooks(ride.id).length&&!confirm('Din bil har '+skBooks(ride.id).length+' bokade passagerare. Ställ in bilen?'))return;
const bk=skMyBook(mm);if(bk&&!confirm('Din bokning avbokas. Fortsätt?'))return;
const x=await sb.rpc('set_ride_choice',{p_match:mm,p_choice:'self'});if(x.error)throw x.error;skClose();await skReload();api('/api/ride',{action:'plan',ride_id:0}).catch(()=>{});return}
if(a=='sk_seat'){skCapture();RS.seats=Math.min(8,Math.max(1,RS.seats+(+v)));skRender();return}
if(a=='sk_start'){skCapture();RS.start=+v;skRender();return}
if(a=='sk_plc'){skCapture();RS.place=+v;skRender();return}
if(a=='sk_addplace'){skCapture();const keep=RS;RS={...keep,ret:keep.mode,mode:'addplace',q:'',sugs:[],sel:null,label:'',kind:RD.places.length?'annan':'hem',edit:null,err:''};skRender();return}
if(a=='sk_kind'){skCapture();RS.kind=v;skRender();return}
if(a=='sk_sug'){skCapture();RS.sel=RS.sugs[+v];RS.q=RS.sel.address;RS.sugs=[];if(!RS.label&&RS.mode=='addplace')RS.label=({hem:'Hemma',station:'Station',jobb:'Jobbet',annan:''})[RS.kind]||'';skRender();return}
if(a=='sk_savepl'){skCapture();if(!RS.label.trim())throw new Error('Ge platsen ett namn');
const sel=RS.sel||null;if(!sel&&!RS.edit)throw new Error('Välj en adress i listan med träffar');if(!sel&&RS.edit){const op=RD.places.find(x=>x.id==RS.edit);if(op&&RS.q.trim()!=op.address)throw new Error('Välj en adress i listan med träffar')}
RS.busy=true;skRender();let id;
if(RS.edit){const up={label:RS.label.trim(),kind:RS.kind};if(sel){up.address=sel.address;up.lat=sel.lat;up.lng=sel.lng}const x=await sb.from('pickup_places').update(up).eq('id',RS.edit);if(x.error)throw x.error;id=RS.edit}
else{const x=await sb.from('pickup_places').insert({user_id:ME.user.id,label:RS.label.trim(),kind:RS.kind,address:sel.address,lat:sel.lat,lng:sel.lng,is_default:!RD.places.length}).select().single();if(x.error)throw x.error;id=x.data.id}
await loadRides();RS.busy=false;if(RS.ret=='close'||!RS.ret){skClose();renderCallPanels();if(/^#\/konto/.test(location.hash))route();return}
const mode=RS.ret;RS.ret=null;RS.mode=mode;if(mode=='car')RS.start=id;else RS.place=id;RS.err='';skRender();return}
if(a=='sk_savecar'){skCapture();const f=skFx(RS.m);if(!f||!f.dt||f.dt.length<=10)throw new Error('Matchen saknar avsparkstid – be lagledaren lägga in den');
if(!/^\d\d:\d\d$/.test(RS.time))throw new Error('Välj avgångstid');const depIso=skIso(f.dt.slice(0,10),RS.time);if(Date.parse(depIso)>=Date.parse(skKick(f)))throw new Error('Avgången måste vara före avspark');
let st=null;if(RS.start=='custom')st=RS.startCustom;else st=RD.places.find(p=>p.id==RS.start);if(!st)throw new Error('Välj var du åker ifrån (lägg till en adress)');

if(a=='sk_pickride'){skOpen(RS.m,'pick',+v);return}
if(a=='sk_book'){const pl=RD.places.find(p=>p.id==RS.place);if(!pl)throw new Error('Välj upphämtningsplats (eller lägg till en)');RS.busy=true;skRender();

if(a=='sk_pnew'){skOpen(null,'addplace');RS.ret='close';skRender();return}
if(a=='sk_pedit'){const p=RD.places.find(x=>x.id==+v);if(!p)return;skOpen(null,'addplace');RS.ret='close';RS.edit=p.id;RS.label=p.label;RS.kind=p.kind;RS.q=p.address;skRender();return}
if(a=='sk_pdef'){const x1=await sb.from('pickup_places').update({is_default:false}).eq('user_id',ME.user.id);if(x1.error)throw x1.error;const x2=await sb.from('pickup_places').update({is_default:true}).eq('id',+v);if(x2.error)throw x2.error;await skReload();return}
if(a=='sk_pdel'){const p=RD.places.find(x=>x.id==+v);if(!p||!confirm('Ta bort "'+p.label+'"?'))return;const x=await sb.from('pickup_places').delete().eq('id',p.id);if(x.error)throw x.error;if(p.is_default){const rest=RD.places.filter(y=>y.id!=p.id)[0];if(rest)await sb.from('pickup_places').update({is_default:true}).eq('id',rest.id)}await skReload();return}
}catch(e){const msg=skErr(e);if(RS){RS.busy=false;RS.err=msg;skRender()}else{ME.msg='⚠️ '+msg;rerenderMe()}}}
function skVenueAsk(rideId){const r=rideId?RD.rides.find(x=>x.id==rideId):null;const m=r?r.match_id:(RS?RS.m:null);if(!m)return;skOpen(m,'venue');RS.ride=rideId||null;skRender()}
