<script src="config.js"></script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const GC=window.GT_CONFIG||{};
if(!GC.SUPABASE_URL||/DITT-PROJEKT/.test(GC.SUPABASE_URL)||!GC.SUPABASE_ANON_KEY||/DIN-ANON/.test(GC.SUPABASE_ANON_KEY)){document.getElementById('app').innerHTML='<div class="card"><b>Appen är inte kopplad till Supabase ännu.</b><br>Öppna <code>config.js</code> och fyll i SUPABASE_URL och SUPABASE_ANON_KEY (se README.md).</div>';throw new Error('Supabase är inte konfigurerat')}

// ---------- data från Supabase
const MON=['jan.','feb.','mars','apr.','maj','juni','juli','aug.','sep.','okt.','nov.','dec.'];
const dlab=s=>{const[y,m,d]=String(s).slice(0,10).split('-').map(Number);return d+' '+MON[m-1]+' '+y};
async function fetchAll(t){let out=[],from=0;for(;;){const{data,error}=await sb.from(t).select('*').range(from,from+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000}return out}
function groupTips(rows){const tips={},seen=new Set();rows.slice().sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at)).forEach(t=>{const k=t.match_id+'|'+t.uid;if(seen.has(k))return;seen.add(k);(tips[t.match_id]||(tips[t.match_id]=[])).push({m:String(t.match_id),name:t.name,a:t.a,b:t.b,t:Date.parse(t.created_at)})});return tips}
async function loadTips(){TIPS=groupTips(await fetchAll('tips'))}
async function loadAll(){
const names=['series','players','matches','match_players','match_events','fixtures','leagues','league_rows','seasons','awards','news','tips','youtube','settings'];
const R=Object.fromEntries(await Promise.all(names.map(async t=>[t,await fetchAll(t)])));
const series=R.series.slice().sort((a,b)=>a.ord-b.ord).map(x=>({key:x.key,lab:x.lab,sl:x.sl,ssn:x.ssn,color:x.color,cur:!!x.cur}));

R.match_events.slice().sort((a,b)=>a.match_id-b.match_id||a.ord-b.ord).forEach(e=>{const m=md[e.match_id];if(m)m.e.push([e.t||'',e.type,e.who||'',e.assist])});
let fix=R.fixtures.slice().sort((a,b)=>String(a.played_on).localeCompare(String(b.played_on))||a.id-b.id).map(f=>({id:String(f.id),o:f.opp,s:f.series,d:dlab(f.played_on),dt:f.kickoff?String(f.played_on).slice(0,10)+'T'+String(f.kickoff).slice(0,5):String(f.played_on).slice(0,10),venue:f.venue||''}));

if(!fix.length)fix=[{id:'0',o:'Nästa match meddelas',s:curK[curK.length-1]||'',d:'',dt:'',ph:true}];
const f0=fix[0],next={id:f0.id,opp:f0.o,s:f0.s,d:f0.d,date:f0.dt,venue:f0.venue||lb(f0.s),home:true,round:'Match '+f0.id};
const tl=R.leagues.slice().sort((a,b)=>a.ord-b.ord).map(l=>Object.assign({k:l.key,t:l.title,rows:R.league_rows.filter(r=>r.league==l.key).sort((a,b)=>a.pos-b.pos).map(r=>[r.pos,r.team,r.m,r.v,r.o,r.f,r.gf,r.ga,r.gd,r.p])},l.note?{note:l.note}:{}));
const seasons=R.seasons.slice().sort((a,b)=>a.ord-b.ord).map(s=>Object.assign({n:s.n,v:s.v,div:s.div,pl:s.pl},s.series_key?{k:s.series_key}:{}));
const awards=R.awards.map(a=>({id:a.id,k:a.kind,s:a.season,n:a.player_name,note:a.note||''}));
const yt={};R.youtube.forEach(y=>{yt[y.match_id]=y.video_id});
const S=Object.fromEntries(R.settings.map(x=>[x.key,x.value]));
const players=R.players.map(p=>Object.assign({id:p.id,name:p.name,no:p.no||'',pos:p.pos||'',g:p.grp||'',debut:p.debut||'',bio:p.bio||'',def:!!p.is_def},p.photo?{photo:p.photo}:{}));
const news=R.news.map(n=>({id:n.id,t:Date.parse(n.created_at),title:n.title||'',text:n.body||'',img:n.img||''})).sort((a,b)=>b.t-a.t);
return{club:S.club||{name:'Golden Tank',founded:2015,league:''},series,sn:series.map(s=>s.ssn),title:S.title||'Säsong',banner:typeof S.banner=='string'?S.banner:'',results,md,players,tl,seasons,awards,yt,next,fix,news,tips:groupTips(R.tips)}}
// ---------- härledd statistik (rekord, samspel) beräknas av appen från rådata
const fm=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const secOf=t=>{const m=/^(\d+):(\d+)$/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
const cmpS=(a,b)=>a<b?-1:a>b?1:0;
function derive(){DB.rec=staticRecs();DB.sam=buildSam()}
function staticRecs(){const res={};DB.results.forEach(r=>{res[r.id]=r});const ids=DB.results.map(r=>+r.id).sort((a,b)=>a-b),mrow=m=>res[m].o+' · '+res[m].d,rec=[],add=(g,t,r,kw)=>rec.push(Object.assign({g,t,r},kw||{}));
const perf=[];ids.forEach(m=>{const x=DB.md[m];if(x)x.p.forEach(p=>{if(p[0]!='Okänd')perf.push([m,p[0],p[1],p[2]])})});
const top=(key,mn,n=15)=>perf.filter(x=>key(x)>=mn).sort((a,b)=>key(b)-key(a)||b[0]-a[0]).slice(0,n);
add('Match','Flest mål i en match',top(x=>x[2],3).map(x=>[String(x[2]),x[1],mrow(x[0]),String(x[0])]));
add('Match','Flest assist i en match',top(x=>x[3],3).map(x=>[String(x[3]),x[1],mrow(x[0]),String(x[0])]));
add('Match','Flest poäng i en match',top(x=>x[2]+x[3],5).map(x=>[String(x[2]+x[3]),x[1],`${x[2]} mål + ${x[3]} assist · ${mrow(x[0])}`,String(x[0])]));
const first={};perf.forEach(x=>{if(!first[x[1]])first[x[1]]=x});
add('Match','Bästa debuten',Object.values(first).sort((a,b)=>(b[2]+b[3])-(a[2]+a[3])||b[2]-a[2]||a[0]-b[0]).slice(0,10).filter(x=>x[2]+x[3]>0).map(x=>[String(x[2]+x[3]),x[1],`${x[2]} mål + ${x[3]} assist · ${mrow(x[0])}`,String(x[0])]));
[['g','Antal mål-hattrick',2],['a','Antal assist-hattrick',3]].forEach(([k,t,i])=>{const c=new Map();perf.forEach(x=>{if(x[i]>=3)c.set(x[1],(c.get(x[1])||0)+1)});add('Match',t,[...c.entries()].sort((a,b)=>b[1]-a[1]).map(([n,v])=>[v+' st',n,'Tryck för matcherna']),{hat:k})});
const sers=new Map();ids.forEach(m=>{const x=DB.md[m];if(!x)return;const s=res[m].s;x.p.forEach(p=>{if(p[0]=='Okänd')return;const k=p[0]+'\u0001'+s;let d=sers.get(k);if(!d){d={n:p[0],s,g:0,a:0};sers.set(k,d)}d.g+=p[1];d.a+=p[2]})});
const sea=(kind,t,f)=>add('Säsong',t,[...sers.values()].sort((x,y)=>f(y)-f(x)).slice(0,10).filter(v=>f(v)>0).map(v=>[String(f(v)),v.n,sl(v.s)]),{kind,serSub:true});
sea('g','Flest mål under en säsong',v=>v.g);sea('a','Flest assist under en säsong',v=>v.a);sea('p','Flest poäng under en säsong',v=>v.g+v.a);
const gT=[],oT=[],hg=[],ha=[];ids.forEach(m=>{const x=DB.md[m];if(!x)return;const e=x.e;e.forEach(v=>{if((v[1]=='g'||v[1]=='pg')&&secOf(v[0])!=null)gT.push([secOf(v[0]),v[2],m]);if(['o','op','os'].includes(v[1])&&secOf(v[0])!=null)oT.push([secOf(v[0]),res[m].o,m])});
[['g',hg],['a',ha]].forEach(([typ,store])=>{const pt={};e.forEach(v=>{if(typ=='g'&&(v[1]=='g'||v[1]=='pg')&&secOf(v[0])!=null)(pt[v[2]]=pt[v[2]]||[]).push(secOf(v[0]));if(typ=='a'&&v[1]=='g'&&v[3]&&secOf(v[0])!=null)(pt[v[3]]=pt[v[3]]||[]).push(secOf(v[0]))});Object.entries(pt).forEach(([n,ts])=>{ts.sort((a,b)=>a-b);if(ts.length>=3){let mn=1e9;for(let i=0;i+2<ts.length;i++)mn=Math.min(mn,ts[i+2]-ts[i]);store.push([mn,n,m])}})})});
const srt=a=>a.sort((x,y)=>x[0]-y[0]||cmpS(x[1],y[1])||x[2]-y[2]).slice(0,8);
add('Snabbast','Snabbaste målet',srt(gT).map(([s,n,m])=>[fm(s),n,mrow(m),String(m)]));
add('Snabbast','Snabbaste insläppta målet',srt(oT).map(([s,o,m])=>[fm(s),'Mot '+o,res[m].d,String(m)]));
add('Snabbast','Snabbaste mål-hattrick',srt(hg).map(([s,n,m])=>[fm(s),n,mrow(m),String(m)]));
add('Snabbast','Snabbaste assist-hattrick',srt(ha).map(([s,n,m])=>[fm(s),n,mrow(m),String(m)]));
const mil=(N,i)=>{const out=[];DB.players.forEach(p=>{let ap=0,cum=0;for(const m of ids){const x=DB.md[m],r=x&&x.p.find(q=>q[0]==p.name);if(!r)continue;ap++;cum+=r[i];if(cum>=N){out.push([ap,m,p.name]);break}}});out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]||cmpS(a[2],b[2]));return out.slice(0,8).map(([ap,m,n])=>[ap+' matcher',n,`Match ${m} · ${res[m].d}`,String(m)])};
add('Snabbast','Snabbast till 50 mål',mil(50,1));add('Snabbast','Snabbast till 50 assist',mil(50,2));add('Snabbast','Snabbast till 100 mål',mil(100,1));add('Snabbast','Snabbast till 100 assist',mil(100,2));
const rs=ids.filter(m=>res[m]).map(m=>res[m]),lrows=(key,n=8)=>rs.slice().sort(key).slice(0,n).map(r=>[r.gf+'-'+r.ga,r.o,r.d,r.id]);
add('Lag','Största vinsten',lrows((a,b)=>(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||b.id-a.id));
add('Lag','Största förlusten',lrows((a,b)=>(b.ga-b.gf)-(a.ga-a.gf)||b.ga-a.ga||b.id-a.id));
add('Lag','Flest gjorda mål i en match',rs.slice().sort((a,b)=>b.gf-a.gf||b.id-a.id).slice(0,8).map(r=>[String(r.gf),r.o,r.d,r.id]));
add('Lag','Flest insläppta mål i en match',rs.slice().sort((a,b)=>b.ga-a.ga||b.id-a.id).slice(0,8).map(r=>[String(r.ga),r.o,r.d,r.id]));
const runs=cond=>{const out=[];let st=null,pv=null;rs.forEach(r=>{const i=+r.id;if(cond(r)){if(st==null)st=i;pv=i}else if(st!=null){out.push([pv-st+1,st,pv]);st=null}});if(st!=null)out.push([pv-st+1,st,pv]);return out.sort((a,b)=>b[0]-a[0]||b[1]-a[1]).slice(0,5)};
[['Flest vinster i rad',r=>r.gf>r.ga],['Flest obesegrade i rad',r=>r.gf>=r.ga],['Flest förluster i rad',r=>r.gf<r.ga]].forEach(([t,c])=>add('Lag',t,runs(c).map(([l,a,b])=>[String(l),`Match ${a}–${b}`,`${res[a].d} – ${res[b].d}`]),{kind:'r'}));
const lg={};rs.forEach(r=>{if(DB.tl.some(t=>t.k==r.s)){const d=lg[r.s]||(lg[r.s]=[0,0]);d[0]+=r.gf;d[1]+=r.ga}});
add('Lag','Flest gjorda mål per liga',Object.entries(lg).sort((a,b)=>b[1][0]-a[1][0]).slice(0,6).map(([k,v])=>[String(v[0]),'Golden Tank',sl(k)]),{kind:'S',serSub:true});
add('Lag','Minst insläppta mål per liga',Object.entries(lg).sort((a,b)=>a[1][1]-b[1][1]).slice(0,6).map(([k,v])=>[String(v[1]),'Golden Tank',sl(k)]),{kind:'S',serSub:true});
return rec}
function buildSam(){const sam={},mk=()=>({f:new Map(),t:new Map(),s:0}),inc=(m,k)=>m.set(k,(m.get(k)||0)+1),get=n=>sam[n]||(sam[n]=mk());
DB.results.slice().sort((a,b)=>a.id-b.id).forEach(r=>{const x=DB.md[r.id];if(!x)return;x.e.forEach(v=>{if(v[1]=='g'){const s=v[2],as=v[3];if(as){inc(get(s).f,as);inc(get(as).t,s)}else if(as==='')get(s).s++}else if(v[1]=='pg')get(v[2]).s++})});
const arr=m=>[...m.entries()].sort((a,b)=>b[1]-a[1]).map(([k,c])=>[k,c]),out={};Object.keys(sam).forEach(n=>{out[n]={f:arr(sam[n].f),t:arr(sam[n].t),s:sam[n].s}});return out}
// ---------- app
const LOGO="logo.webp";document.documentElement.style.setProperty("--logo","url("+LOGO+")");
const DB=await loadAll(),P=DB.players,$=s=>document.querySelector(s);
